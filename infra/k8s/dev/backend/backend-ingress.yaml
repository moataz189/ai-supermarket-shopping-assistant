apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend-ingress
  namespace: dev
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    # ingress-nginx's default proxy-read/send-timeout (60s) is too short for a real
    # multi-item retailer-cart request (each item is a full Playwright navigate/search/
    # add-to-cart cycle against a live site) — same failure mode already fixed for the
    # same reason in web/nginx.conf and infra/tf-il/user-data.sh.tpl; this Ingress is a
    # third hop in front of backend-svc that needed the identical fix.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "180"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "180"
spec:
  ingressClassName: nginx
  rules:
    - host: supermarket-dev.fursa.click
      http:
        paths:
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: backend-svc
                port:
                  number: 8000
