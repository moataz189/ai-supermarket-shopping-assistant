apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: backend-mcp-alerts
  namespace: monitoring
spec:
  groups:
    - name: backend.rules
      rules:
        - alert: BackendHighErrorRate
          expr: |
            100 *
            (
              sum(rate(agent_chat_requests_total{status="error"}[5m]))
              or vector(0)
            )
            /
            clamp_min(
              sum(rate(agent_chat_requests_total[5m])),
              0.000001
            )
            > 5
          for: 5m
          labels:
            severity: warning
            service: backend
          annotations:
            summary: "Backend /chat error rate above 5% ({{ $value | printf \"%.1f\" }}%)"
            description: "More than 5% of backend /chat requests failed over the last 5 minutes, across all namespaces. Check backend pod logs and the Bedrock IAM grants."

        - alert: BackendCriticalErrorRate
          expr: |
            100 *
            (
              sum(rate(agent_chat_requests_total{status="error"}[5m]))
              or vector(0)
            )
            /
            clamp_min(
              sum(rate(agent_chat_requests_total[5m])),
              0.000001
            )
            > 25
          for: 5m
          labels:
            severity: critical
            service: backend
          annotations:
            summary: "Backend /chat error rate above 25% ({{ $value | printf \"%.1f\" }}%)"
            description: "More than a quarter of backend /chat requests are failing -- likely a hard dependency outage (Bedrock or an MCP server), not transient errors."

        - alert: BackendDown
          expr: up{job="backend-svc"} == 0
          for: 2m
          labels:
            severity: critical
            service: backend
          annotations:
            summary: "Backend target is down"
            description: "Prometheus has not been able to scrape backend-svc for 2 minutes -- the chat backend is very likely fully unavailable."

    - name: mcp.rules
      rules:
        # Derived from the backend's own client-side mcp_call_total counter
        # (app/api/metrics.py), not from scraping each MCP server directly -- none of the
        # three MCP servers expose a Prometheus /metrics endpoint of their own, so "an MCP
        # server is unavailable" is only observable through the backend's call outcomes.
        - alert: MCPServiceHighFailureRate
          expr: |
            100 *
            (
              sum(rate(mcp_call_total{status="error"}[5m])) by (mcp_service)
              or vector(0)
            )
            /
            clamp_min(
              sum(rate(mcp_call_total[5m])) by (mcp_service),
              0.000001
            )
            > 10
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.mcp_service }} MCP call failure rate above 10% ({{ $value | printf \"%.1f\" }}%)"
            description: "More than 10% of backend calls to the {{ $labels.mcp_service }} MCP server failed over the last 5 minutes."

        - alert: MCPServiceUnavailable
          expr: |
            sum(rate(mcp_call_total{status="error"}[5m])) by (mcp_service)
            /
            clamp_min(
              sum(rate(mcp_call_total[5m])) by (mcp_service),
              0.000001
            )
            == 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.mcp_service }} MCP server appears unavailable"
            description: "Every backend call to the {{ $labels.mcp_service }} MCP server has failed for 5 minutes straight -- treat as a full outage of that service."

    - name: cluster.rules
      rules:
        - alert: PodCrashLooping
          expr: |
            increase(kube_pod_container_status_restarts_total{namespace=~"dev|prod"}[15m]) > 3
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is crash-looping"
            description: "Container {{ $labels.container }} in {{ $labels.namespace }}/{{ $labels.pod }} has restarted more than 3 times in the last 15 minutes."

        - alert: PodNotReady
          expr: |
            sum by (namespace, pod) (kube_pod_status_ready{condition="false", namespace=~"dev|prod"}) == 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} not ready"
            description: "{{ $labels.namespace }}/{{ $labels.pod }} has not reported Ready for 10 minutes."
