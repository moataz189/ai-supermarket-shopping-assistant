apiVersion: batch/v1
kind: CronJob
metadata:
  name: ingestion
  namespace: prod
spec:
  # Never an always-running Deployment — the ingestion image's own CMD
  # (python -m app.ingestion.run --source fixtures) is a one-shot batch load, not a server.
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: ingestion
              image: moataz189/supermarket-ingestion:latest

              env:
                # Points at the in-cluster Postgres StatefulSet, same as prod's
                # supermarket-mcp — Postgres (unlike dev's SQLite-on-a-PVC) supports
                # concurrent writers, so this job and supermarket-mcp's pod no longer need
                # to share a single ReadWriteOnce volume or land on the same worker node.
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: postgres-credentials
                      key: DATABASE_URL

              resources:
                requests:
                  cpu: "100m"
                  memory: "128Mi"
                limits:
                  cpu: "500m"
                  memory: "512Mi"
