apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: prod
  labels:
    app: postgres
spec:
  # Headless (no ClusterIP) — the correct Service type for a StatefulSet's serviceName,
  # giving the pod stable per-replica DNS (postgres-0.postgres.prod.svc.cluster.local) as
  # well as answering "postgres" itself. Never NodePort/LoadBalancer — Postgres is reachable
  # only from inside the cluster, never from the internet.
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
