apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend
  namespace: prod
  labels:
    app: backend

spec:
  replicas: 1

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend
          image: moataz189/supermarket-backend:f3d1a627480a16f5f2f670ec3bb3b778d7d4703b

          ports:
            - containerPort: 8000

          env:
            # dev stays CHECKPOINTER_BACKEND=memory (see infra/k8s/dev/backend/); prod uses
            # the DynamoDB backend (app/agent/checkpointer.py) backed by the table Terraform
            # provisions (infra/tf/main.tf's aws_dynamodb_table.langgraph_checkpoints) — read/
            # write access comes from the worker node's IAM instance profile, no credentials
            # needed here.
            - name: CHECKPOINTER_BACKEND
              value: "dynamodb"

            # Deterministic name ("${project_name}-checkpoints") matching Terraform's
            # aws_dynamodb_table.langgraph_checkpoints — see infra/tf/outputs.tf's
            # checkpoint_table_name output.
            - name: CHECKPOINT_DYNAMODB_TABLE
              value: "supermarket-assistant-checkpoints"

            - name: AWS_REGION
              value: "us-east-1"

            - name: BEDROCK_MODEL_ID
              value: "openai.gpt-oss-20b-1:0"

            - name: SUPERMARKET_MCP_URL
              value: "http://supermarket-mcp-svc:8001/mcp"

            - name: RECIPE_MCP_URL
              value: "http://recipe-mcp-svc:8002/mcp"

            - name: RETAILER_CART_MCP_URL
              value: "https://retailer-cart.fursa.click/mcp"

            - name: DEPLOYMENT_ENVIRONMENT
              value: "prod"

            - name: RETAILER_CART_MCP_API_KEY
              valueFrom:
                secretKeyRef:
                  name: retailer-cart-mcp-api-key
                  key: RETAILER_CART_MCP_API_KEY

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          # No separate /ready endpoint exists in this app (unlike the reference agent's
          # /health + /ready pair) — app/api/main.py only defines /health. Reused for both
          # probes rather than inventing an unimplemented endpoint.
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
