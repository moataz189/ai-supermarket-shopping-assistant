apiVersion: apps/v1
kind: Deployment

metadata:
  name: retailer-cart-mcp
  namespace: prod
  labels:
    app: retailer-cart-mcp

spec:
  replicas: 1

  selector:
    matchLabels:
      app: retailer-cart-mcp

  template:
    metadata:
      labels:
        app: retailer-cart-mcp

    spec:
      # Native Kubernetes sidecar.
      # Starts before retailer-cart-mcp and stays alive for the whole Pod lifetime.
      initContainers:
        - name: gluetun
          image: qmcgaw/gluetun:latest
          imagePullPolicy: Always

          restartPolicy: Always

          securityContext:
            capabilities:
              add:
                - NET_ADMIN

          env:
            # Surfshark through WireGuard
            - name: VPN_SERVICE_PROVIDER
              value: "surfshark"

            - name: VPN_TYPE
              value: "wireguard"

            - name: SERVER_COUNTRIES
              value: "Israel"

            # Created earlier as Kubernetes Secret.
            - name: WIREGUARD_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: surfshark-gluetun
                  key: WIREGUARD_PRIVATE_KEY

            - name: WIREGUARD_ADDRESSES
              valueFrom:
                secretKeyRef:
                  name: surfshark-gluetun
                  key: WIREGUARD_ADDRESSES

            # The Kubernetes Service/backend must still be able to reach
            # retailer-cart-mcp on port 8003 through Gluetun's firewall.
            - name: FIREWALL_INPUT_PORTS
              value: "8003"

            # Internal traffic must remain outside the VPN:
            #
            # 10.0.0.0/16    -> AWS VPC
            # 10.96.0.0/12   -> Kubernetes Service CIDR
            # 192.168.0.0/16 -> Calico Pod CIDR
            - name: FIREWALL_OUTBOUND_SUBNETS
              value: "10.0.0.0/16,10.96.0.0/12,192.168.0.0/16"

          # Do not start retailer-cart-mcp until Gluetun reports
          # that the VPN connection is healthy.
          startupProbe:
            exec:
              command:
                - /gluetun-entrypoint
                - healthcheck
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30

          # If the VPN later becomes unhealthy, Kubernetes also sees it.
          readinessProbe:
            exec:
              command:
                - /gluetun-entrypoint
                - healthcheck
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

      containers:
        - name: retailer-cart-mcp
          image: moataz189/retailer-cart-mcp:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 8003
              protocol: TCP

          env:
            - name: PORT
              value: "8003"

            - name: RETAILER_SESSIONS_DIR
              value: "/app/sessions"

          volumeMounts:
            - name: sessions
              mountPath: /app/sessions
              readOnly: true

          # This is the only MCP service running a real Chromium instance
          # through Playwright, so it gets higher resource limits.
          resources:
            requests:
              cpu: "300m"
              memory: "512Mi"
            limits:
              cpu: "1500m"
              memory: "1536Mi"

          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

      # Session cookies are supplied through Kubernetes Secret.
      volumes:
        - name: sessions
          secret:
            secretName: retailer-cart-sessions