apiVersion: apps/v1
kind: Deployment

metadata:
  name: retailer-cart-mcp
  namespace: prod
  labels:
    app: retailer-cart-mcp

spec:
  replicas: 1

  selector:
    matchLabels:
      app: retailer-cart-mcp

  template:
    metadata:
      labels:
        app: retailer-cart-mcp

    spec:
      containers:
        - name: retailer-cart-mcp
          image: moataz189/retailer-cart-mcp:latest

          ports:
            - containerPort: 8003

          env:
            - name: PORT
              value: "8003"

            - name: RETAILER_SESSIONS_DIR
              value: "/app/sessions"

          volumeMounts:
            - name: sessions
              mountPath: /app/sessions
              readOnly: true

          # Bumped up from the other MCP services: this is the only image that runs a real
          # Chromium instance (via Playwright) per request, which the reference has no
          # equivalent of.
          resources:
            requests:
              cpu: "300m"
              memory: "512Mi"
            limits:
              cpu: "1500m"
              memory: "1536Mi"

          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

      # Session cookies (sessions/<retailer>.json, produced out-of-band by
      # mcp_servers/retailer_cart_mcp/login.py — never committed) are supplied as a
      # Secret, not a host bind-mount like docker-compose's ./sessions:/app/sessions:ro —
      # there is no single persistent host directory across a Kubernetes node pool. Create
      # per environment with, e.g.:
      #   kubectl create secret generic retailer-cart-sessions -n dev \
      #     --from-file=shufersal.json=sessions/shufersal.json \
      #     --from-file=rami_levy.json=sessions/rami_levy.json
      volumes:
        - name: sessions
          secret:
            secretName: retailer-cart-sessions
