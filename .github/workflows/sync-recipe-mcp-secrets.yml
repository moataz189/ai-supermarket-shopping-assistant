name: Sync Recipe MCP Secrets

# No equivalent in polyaifursa (it has no third-party recipe API concept) — new workflow,
# not adapted from an existing one. Keeps the recipe-mcp-secrets Kubernetes Secret (dev
# and prod, one each, since Secrets are namespace-scoped) in sync with SPOONACULAR_API_KEY
# stored in GitHub Secrets, so a fresh checkout of this repo never contains the key and no
# image ever bakes it in — see infra/k8s/{dev,prod}/recipe-mcp/recipe-mcp-deployment.yaml.
# Manual-only: this key rarely changes, and there's no reason to re-run this on every push.
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: sync-recipe-mcp-secrets
  cancel-in-progress: true

jobs:
  sync:
    name: Sync recipe-mcp-secrets Secret to both namespaces
    runs-on: ubuntu-latest

    steps:
      # CONTROL_PLANE_IP is a repo variable persisted by .github/workflows/cluster.yaml
      # (local Terraform state means this workflow has no other way to know the cluster's
      # address). If it isn't set yet, the cluster hasn't been provisioned.
      - name: Require CONTROL_PLANE_IP
        run: |
          if [ -z "${{ vars.CONTROL_PLANE_IP }}" ]; then
            echo "CONTROL_PLANE_IP repo variable is not set — run the 'Provision Kubernetes Cluster' workflow first." >&2
            exit 1
          fi

      - name: Require SPOONACULAR_API_KEY
        run: |
          if [ -z "${{ secrets.SPOONACULAR_API_KEY }}" ]; then
            echo "SPOONACULAR_API_KEY GitHub Secret is not set." >&2
            exit 1
          fi

      - name: Sync recipe-mcp-secrets Secret (dev and prod)
        uses: appleboy/ssh-action@v1
        env:
          SPOONACULAR_API_KEY: ${{ secrets.SPOONACULAR_API_KEY }}
        with:
          host: ${{ vars.CONTROL_PLANE_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: SPOONACULAR_API_KEY
          script: |
            set -euo pipefail

            for ns in dev prod; do
              sudo kubectl --kubeconfig /etc/kubernetes/admin.conf \
                create secret generic recipe-mcp-secrets \
                -n "$ns" \
                --from-literal=SPOONACULAR_API_KEY="$SPOONACULAR_API_KEY" \
                --dry-run=client -o yaml \
                | sudo kubectl --kubeconfig /etc/kubernetes/admin.conf apply -f -

              echo "recipe-mcp-secrets Secret synced in namespace $ns."
            done
