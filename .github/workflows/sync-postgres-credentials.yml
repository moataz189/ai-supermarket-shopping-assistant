name: Sync Postgres Credentials

# No equivalent in polyaifursa — new workflow, not adapted from an existing one.
# Prod-only (infra/k8s/prod/postgres/ is the only Postgres — dev stays on SQLite): creates
# the postgres-credentials Kubernetes Secret the first time it's missing, then leaves it
# alone on every later run. Idempotent-by-design, unlike sync-retailer-sessions.yml's
# always-overwrite behavior — Postgres only reads POSTGRES_USER/PASSWORD/DB once, at first
# initialization (initdb), so overwriting the Secret after that would desync the stored
# password from what the already-running database actually accepts, locking every app pod
# out. No GitHub Secret is required: the password is generated on the control-plane node
# itself the one time it's needed and never leaves the cluster.
on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: sync-postgres-credentials-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    name: Create postgres-credentials Secret if missing
    runs-on: ubuntu-latest

    steps:
      # CONTROL_PLANE_IP is a repo variable persisted by .github/workflows/cluster.yaml
      # (local Terraform state means this workflow has no other way to know the cluster's
      # address). If it isn't set yet, the cluster hasn't been provisioned.
      - name: Require CONTROL_PLANE_IP
        run: |
          if [ -z "${{ vars.CONTROL_PLANE_IP }}" ]; then
            echo "CONTROL_PLANE_IP repo variable is not set — run the 'Provision Kubernetes Cluster' workflow first." >&2
            exit 1
          fi

      - name: Create postgres-credentials Secret (only if it doesn't already exist)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.CONTROL_PLANE_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail

            if sudo kubectl --kubeconfig /etc/kubernetes/admin.conf \
                 get secret postgres-credentials -n prod >/dev/null 2>&1; then
              echo "postgres-credentials already exists in prod — leaving it untouched (Postgres only reads it at first initdb)."
              exit 0
            fi

            POSTGRES_USER="app"
            POSTGRES_DB="supermarket"
            POSTGRES_PASSWORD="$(openssl rand -base64 24)"
            DATABASE_URL="postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"

            sudo kubectl --kubeconfig /etc/kubernetes/admin.conf \
              create secret generic postgres-credentials \
              -n prod \
              --from-literal=POSTGRES_USER="$POSTGRES_USER" \
              --from-literal=POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
              --from-literal=POSTGRES_DB="$POSTGRES_DB" \
              --from-literal=DATABASE_URL="$DATABASE_URL"

            unset POSTGRES_PASSWORD DATABASE_URL

            echo "postgres-credentials created in prod (first run)."
