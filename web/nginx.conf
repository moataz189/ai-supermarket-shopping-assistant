server {
  listen 80;

  # Docker's embedded DNS — resolves "backend" for local docker-compose, where a service
  # literally named "backend" exists. In Kubernetes no such service exists (it's
  # "backend-svc" there), but that's fine: the Ingress routes /api directly to backend-svc
  # before traffic ever reaches this pod, so this resolver is never actually consulted
  # there. It only needs to not crash nginx at startup — see the proxy_pass variable below.
  resolver 127.0.0.11 valid=10s;

  location /api/ {
    # A variable (not a static hostname) forces nginx to resolve "backend" lazily at
    # request time via the resolver above, instead of eagerly at startup. A static
    # hostname here makes nginx fail to boot entirely ("host not found in upstream") the
    # moment "backend" isn't resolvable — which is always true in Kubernetes, where this
    # whole location block is unreachable dead code (see web-deployment.yaml's comment).
    set $backend_upstream "http://backend:8000";
    proxy_pass $backend_upstream/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # nginx's default proxy_read_timeout (60s) is too short for this backend: a single
    # /chat request can legitimately take longer than that (Bedrock retrying a transient
    # ServiceUnavailableException with backoff, or a multi-item retailer-cart request with
    # several real-site Playwright interactions). Observed live: nginx gave up and
    # returned a 504 to the browser while the backend was still correctly working the
    # request and would have returned a real response shortly after — a premature,
    # confusing failure masking a legitimate (if slow) one. proxy_connect_timeout stays
    # short since connecting to `backend` over the compose network should be near-instant.
    proxy_connect_timeout 10s;
    proxy_send_timeout 180s;
    proxy_read_timeout 180s;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
